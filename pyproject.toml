[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingview-bot-v2"
version = "0.1.0"
description = "Replay-first Python TradingView bot v2 over local Supabase datafeeds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "python-dotenv>=1",
  "requests>=2",
  "psycopg[binary]>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
